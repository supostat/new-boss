services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: boss
      POSTGRES_DB: boss
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss -d boss"]
      interval: 2s
      timeout: 3s
      retries: 15

  mail:
    # Dev-only mail catcher; the image publishes no major-version tag line.
    # Host ports sit off Mailpit's defaults so a second local Mailpit can coexist.
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
